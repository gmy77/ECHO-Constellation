[package]
name = "echo-constellation"
version = "1.0.0"
edition = "2021"
description = "ECHO Constellation: satelliti in tempo reale su mappa piatta (server locale con cache CelesTrak)"

[[bin]]
name = "echo-constellation"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
ureq = "2.12"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
